# Render Blueprint — New → Blueprint → this repo. Values marked sync:false are
# prompted for at creation time and never stored in git.
services:
  - type: web
    name: recoveros
    runtime: node
    plan: starter            # free instances sleep and cold-start for a minute; not for a demo
    region: singapore        # next to the Neon database
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RAZORPAY_TEST_MODE
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL          # set to https://<service>.onrender.com after the first deploy
        sync: false
